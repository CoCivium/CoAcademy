name: Public Pages exact-object readback
# Bounded proof of GitHub Pages publication for CoParallel+/CoNav+.
# A source commit, synthetic browser test, or scheduled run is NOT audience reach.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - docs/coparallel/**
      - docs/conav/**
      - docs/cogbx/**
      - docs/megascroller/**
      - docs/index.html
      - docs/discover/**
      - docs/cogibber/**
      - docs/laneset/**
      - docs/reviewpanel/**
      - docs/transparency/**
      - docs/constellation/cloudops/**
      - docs/constellation/federation/**
      - docs/constellation/positioning/**
      - docs/assets/cofront/**
      - .github/workflows/public-pages-readback.yml
      - .github/scripts/public-first-use-browser.mjs
      - tools/cofed_coldboot_capsule.py
      - .github/scripts/cofed-coldboot-browser.mjs
      - .github/scripts/cofed-zero-network-coldboot.mjs
      - tools/cowalkaway_fanin_canary.py
      - docs/constellation/bubbles/**
      - docs/constellation/walkaway/**
      - docs/constellation/patterns/**
      - tools/copatterna_registry_canary.py
  schedule:
    - cron: '31 8 * * *'
permissions:
  contents: read
concurrency:
  group: pages-readback
  cancel-in-progress: true
jobs:
  verify-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Inspect independent HTTPS receiver and compare source bytes
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.request
          base = 'https://cocivium.github.io/CoAcademy/'
          targets = [
              ('CoAcademy first-use home', 'docs/index.html', base),
              ('CoAcademy discovery hub', 'docs/discover/index.html', base + 'discover/'),
              ('CoFront shared task-card style', 'docs/assets/cofront/cofront-r0.css', base + 'assets/cofront/cofront-r0.css'),
              ('CoFront pattern metadata', 'docs/assets/cofront/cofront-r0.json', base + 'assets/cofront/cofront-r0.json'),
              ('CoGibber first task', 'docs/cogibber/index.html', base + 'cogibber/'),
              ('CoGibber machine twin', 'docs/cogibber/discovery.json', base + 'cogibber/discovery.json'),
              ('CoAthene R1 learner task', 'docs/laneset/r1/index.html', base + 'laneset/r1/'),
              ('CoReviewPanel human review', 'docs/reviewpanel/index.html', base + 'reviewpanel/'),
              ('CoReviewPanel machine twin', 'docs/reviewpanel/discovery.json', base + 'reviewpanel/discovery.json'),
              ('CoAcademy Trust page', 'docs/transparency/index.html', base + 'transparency/'),
              ('CoAcademy Trust machine facts', 'docs/transparency/site.json', base + 'transparency/site.json'),
              ('CoPosition comparison', 'docs/constellation/positioning/index.html', base + 'constellation/positioning/'),
              ('CoCloudOps use-case catalogue', 'docs/constellation/cloudops/index.html', base + 'constellation/cloudops/'),
              ('CoCloudOps machine catalogue', 'docs/constellation/cloudops/catalog.json', base + 'constellation/cloudops/catalog.json'),
              ('CoFed failure simulation', 'docs/constellation/federation/index.html', base + 'constellation/federation/'),
              ('CoFed typed fixture', 'docs/constellation/federation/fixture.json', base + 'constellation/federation/fixture.json'),
              ('CoWalkaway calm UX', 'docs/constellation/walkaway/index.html', base + 'constellation/walkaway/'),
              ('CoWalkaway machine status', 'docs/constellation/walkaway/status.json', base + 'constellation/walkaway/status.json'),
              ('CoPatterna human explorer', 'docs/constellation/patterns/index.html', base + 'constellation/patterns/'),
              ('CoPatterna machine registry', 'docs/constellation/patterns/registry.json', base + 'constellation/patterns/registry.json'),
              ('CoParallel interactive', 'docs/coparallel/index.html', base + 'coparallel/'),
              ('CoParallel research data', 'docs/coparallel/discovery.json', base + 'coparallel/discovery.json'),
              ('CoNav visual index', 'docs/conav/index.html', base + 'conav/'),
              ('CoNav static matrix', 'docs/conav/matrix.html', base + 'conav/matrix.html'),
              ('CoNav machine data', 'docs/conav/discovery.json', base + 'conav/discovery.json'),
              ('CoGbx human/machine UI', 'docs/cogbx/index.html', base + 'cogbx/'),
              ('CoGbx typed provenance', 'docs/cogbx/discovery.json', base + 'cogbx/discovery.json'),
              ('CoMegaScroller visual highlights', 'docs/megascroller/index.html', base + 'megascroller/'),
          ]
          results = []
          for name, path, url in targets:
              src = pathlib.Path(path).read_bytes()
              expected = hashlib.sha256(src).hexdigest()
              item = {'name': name, 'url': url, 'source_path': path,
                      'source_sha256': expected, 'receiver_state': 'NOT_VERIFIED'}
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'CoCiviumPublicReadback/0.1', 'Accept':'text/html,application/json'})
                      with urllib.request.urlopen(req, timeout=15) as res:
                          data = res.read(300000)
                          item.update({'http_status': res.status, 'receiver_bytes': len(data),
                                       'receiver_sha256': hashlib.sha256(data).hexdigest(),
                                       'receiver_state': 'EXACT_MATCH' if data == src else 'SOURCE_MISMATCH',
                                       'attempt': attempt})
                          if data == src:
                              break
                  except Exception as e:
                      item.update({'receiver_state': 'HTTP_OR_DNS_FAILURE',
                                   'error': type(e).__name__ + ': ' + str(e)[:250],
                                   'attempt': attempt})
                  if attempt < 3:
                      time.sleep(6 * attempt)
              results.append(item)
              print(name + ' => ' + item['receiver_state'], flush=True)
          report = {'schema': 'CoCivium.PagesReadback.R0', 'source_commit': os.environ.get('SOURCE_COMMIT'),
                    'scope': 'independent GitHub-hosted runner HTTP GET against public Pages endpoints',
                    'results': results, 'exact_matches': sum(x['receiver_state']=='EXACT_MATCH' for x in results),
                    'count': len(results),
                    'nonclaims': ['SOURCE_COMMIT_NE_LIVE_SITE', 'PAGES_PASS_NE_INDEPENDENT_USER_ACCEPTANCE',
                                  'REMOTE_HTTP_PASS_NE_X2_COSTEAD_RUNTIME',
                                  'NO_AUTOMATED_OUTREACH_OR_PERSONAL_DATA']}
          pathlib.Path('pages-readback-report.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps({'exact_matches':report['exact_matches'], 'count':report['count'],
                            'source_commit':report['source_commit']}))
          if report['exact_matches'] != report['count']:
              raise SystemExit('HOLD: not all public URLs independently match exact checked-out source')
          PY
      - name: Preserve readback receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-readback-receipt
          path: pages-readback-report.json
          retention-days: 30

  verify-browser-first-use:
    # A bounded real-browser canary on explicit changes/dispatch, not another
    # continuously running watcher or new schedule.
    if: github.event_name != 'schedule'
    needs: verify-public-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
      - name: Use Node 22 for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scoped headless browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Interact with the live published CoGbx and megascroller
        run: node .github/scripts/public-first-use-browser.mjs
      - name: Preserve browser QA evidence, including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-first-use-browser-receipt
          path: public-first-use-browser-receipt.json
          if-no-files-found: warn
          retention-days: 14

  verify-coldboot-capsule:
    # Reuse the existing event-driven workflow. No new cron, remote writer,
    # provider mirror, credentials, or private source mutation.
    if: github.event_name != 'schedule'
    needs: verify-public-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout pinned public source
        uses: actions/checkout@v4
      - name: Build deterministic first-use capsule
        run: python3 tools/cofed_coldboot_capsule.py
      - name: Extract and independently verify capsule payload
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path(".ci/coldboot")
          archive=root/"cofed-cogibber-coldboot-r0.zip"
          dest=root/"restored"
          dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              names=z.namelist()
              assert len(names)==len(set(names)), "duplicate zip entries"
              assert set(names)=={"SHA256SUMS","manifest.json","site/index.html","site/discovery.json","site/README.md"}
              assert all(not pathlib.PurePosixPath(n).is_absolute() and ".." not in pathlib.PurePosixPath(n).parts for n in names)
              z.extractall(dest)
          manifest=json.loads((dest/"manifest.json").read_text())
          assert manifest["schema"]=="CoFed.ColdBootCapsule.R0"
          for item in manifest["files"]:
              body=(dest/item["bundled_path"]).read_bytes()
              assert len(body)==item["bytes"]
              assert hashlib.sha256(body).hexdigest()==item["sha256"],item["bundled_path"]
          for line in (dest/"SHA256SUMS").read_text().splitlines():
              expected,name=line.split("  ",1)
              assert hashlib.sha256((dest/name).read_bytes()).hexdigest()==expected,name
          print("PASS_CLEAN_EXTRACT_SHA256 "+str(len(names))+" entries")
          PY
      - name: Use Node 22 for scoped Chromium
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scoped local browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Boot clean capsule via loopback and test first task offline after load
        run: node .github/scripts/cofed-coldboot-browser.mjs
      - name: Reject deliberately tampered archive data
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path(".ci/coldboot/restored")
          manifest=json.loads((root/"manifest.json").read_text())
          entry=next(x for x in manifest["files"] if x["bundled_path"]=="site/index.html")
          body=(root/entry["bundled_path"]).read_bytes()
          corrupted=body+b"\\n<!-- deliberate corruption fixture -->"
          assert hashlib.sha256(body).hexdigest()==entry["sha256"]
          assert hashlib.sha256(corrupted).hexdigest()!=entry["sha256"]
          (root/"tamper-negative-receipt.json").write_text(json.dumps({
              "schema":"CoFed.CapsuleTamperNegative.R0",
              "result":"PASS_CORRUPTED_PAYLOAD_REJECTED",
              "source_sha256":entry["sha256"],
              "corrupt_sha256":hashlib.sha256(corrupted).hexdigest(),
              "effect":"NONE",
              "note":"In-memory mutation only; original archive and restored file untouched"
          },indent=2)+"\\n")
          print("PASS_CORRUPTED_PAYLOAD_REJECTED")
          PY
      - name: Open clean capsule from file URL with network disabled before navigation
        run: node .github/scripts/cofed-zero-network-coldboot.mjs
      - name: Preserve capsule, hashes and boot receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cofed-coldboot-capsule-and-receipt
          path: |
            .ci/coldboot/cofed-cogibber-coldboot-r0.zip
            .ci/coldboot/build-receipt.json
            .ci/coldboot/boot-receipt.json
            .ci/coldboot/zero-network-receipt.json
            .ci/coldboot/restored/tamper-negative-receipt.json
          if-no-files-found: warn
          retention-days: 30

  verify-steward-optional-fanin:
    # Distinct read-only CoGlyphList/CoTalkItOut proposal boundary.  This test
    # does NOT own the CoSession/CoEvo fan-in, issue ACKs, or authorize effects.
    # A failed website readback should not freeze unrelated safe source analysis.
    if: always()
    needs: verify-public-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Checkout scoped public candidate source
        uses: actions/checkout@v4
      - name: Test bounded fan-in without steward, effects or external access
        run: python3 tools/cowalkaway_fanin_canary.py
      - name: Test CoPatterna bounded source registry and ten negative mutations
        run: python3 tools/copatterna_registry_canary.py
      - name: Preserve exact no-effect report for independent inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cowalkaway-source-fanin-canary
          path: |
            .ci/walkaway/fan-in-canary.json
            .ci/patterns/registry-proof.json
          if-no-files-found: warn
          retention-days: 30
