name: CoRelay public readproof
on:
  push:
    branches: [master]
    paths:
      - 'tools/corelay_probe.py'
      - 'tools/test_corelay_probe.py'
      - '.github/workflows/corelay-public-probe.yml'
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: corelay-public-readproof
  cancel-in-progress: false
jobs:
  source-regression:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout source only
        uses: actions/checkout@v4
      - name: Run deterministic source-freshness and failure-injection tests
        run: python3 -m unittest discover -s tools -p 'test_corelay_probe.py' -v
  public-readproof:
    if: github.event_name != 'push' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source only
        uses: actions/checkout@v4
      - name: Self-test bounded HTTP probe without external access
        run: python3 -m unittest discover -s tools -p 'test_corelay_probe.py' -v
      - name: Check public GitHub Pages and same-provider source fallback
        run: python3 tools/corelay_probe.py --output artifacts/corelay-readproof.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Preserve the run-specific readproof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corelay-public-readproof
          path: artifacts/corelay-readproof.json
          retention-days: 14
          if-no-files-found: warn
