name: CoPhoenix public HTTP readproof R1
on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'
  push:
    paths:
      - '.github/workflows/cophoenix-public-readproof.yml'
      - 'docs/phoenix/probe_public.py'
permissions:
  contents: read
concurrency:
  group: cophoenix-public-readproof
  cancel-in-progress: false
jobs:
  readproof:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout nonsecret source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test exact allowlist
        run: python3 docs/phoenix/probe_public.py --selftest
      - name: Read public pages and source
        run: python3 docs/phoenix/probe_public.py
      - name: Preserve receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cophoenix-public-readproof-r1
          path: co_phoenix_public_readproof.json
          retention-days: 14
          if-no-files-found: warn
